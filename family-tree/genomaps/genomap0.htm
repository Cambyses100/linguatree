<title>Very strongly identified as the son of William Charles Shafe and Florence Louisa Webster. His 1893 Walworth baptism names Charles William and Florence Louisa Shafe; the 1901 census records Harry C. as their son. His 1911 marriage instead names his father as Henry Charles Shafe, box maker, probably a forename error because the occupation matches William and the groom himself was Henry Charles. Served in the Royal Field Artillery during the First World War and was discharged in Glasgow on 10 January 1918 as no longer physically fit. Service description: 5 ft 10 in, blue eyes, brown hair, tattoos on both arms; described as steady, solid and industrious. Occupation on marriage: porter.</title>

<title>Shoemaker or boot maker. In Bury St Edmunds in 1841 and in Christ Church, Southwark by 1861. In 1881 he and Mary were at the Holland Street almshouses, almost certainly Hopton&#39;s Almshouses; he was described as a shoemaker (almsman). His 1 March 1890 entry is in the Christ Church Workhouse death register, with civil death registered in St Saviour aged 87. Parents not ascertained. The London copper-plate manufacturer John Shafe (apprenticed 1794; died 1846) remains a research lead because of the rare surname and because this John&#39;s son Charles was a copper-plate polisher. However, the manufacturer&#39;s will centres on three minor natural children by Jane Hewitt and supplies no adult son or Suffolk connection, so no pedigree link is justified. Search Shafe, Shave, Shape, Shaff, Shaffe, Sheaf, Schafe and Scafe in Bury, Debenham, Depden and nearby registers, settlement and apprenticeship records. Correction: an earlier tree note wrongly attributed an 1820 larceny and transportation case to John; the defendant was Robert Shafe.</title>
</g>
